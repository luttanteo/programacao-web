<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        fieldset {
            width: 400px;
            padding: 10px;
        }
        label {
            display: block;
            margin-top: 5px;
        }
        .inline {
            display: inline-block;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <h2>Identificação do Usuário</h2>
    <form action="#" method="post">
        <fieldset>
            <label for="nome">Nome*:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="senha">Senha*:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="cpf">CPF*:</label>
            <input type="text" id="cpf" name="cpf" required>

            <label>Sexo*:</label>
            <input type="radio" id="masculino" name="sexo" value="masculino" required>
            <label for="masculino" class="inline">Masculino</label>

            <input type="radio" id="feminino" name="sexo" value="feminino" required>
            <label for="feminino" class="inline">Feminino</label>

            <label for="data_nascimento">Data Nascimento*:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required>

            <label for="estado_civil">Estado Civil*:</label>
            <select id="estado_civil" name="estado_civil" required>
                <option value="">Selecione</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
                <option value="viuvo">Viúvo(a)</option>
            </select>

            <label for="escolaridade">Escolaridade:</label>
            <input type="text" id="escolaridade" name="escolaridade">

            <label for="ocupacao">Ocupação Principal:</label>
            <input type="text" id="ocupacao" name="ocupacao">

            <label for="renda">Renda Mensal:</label>
            <input type="number" id="renda" name="renda" step="0.01">

            <label for="dependentes">Número de Dependentes:</label>
            <input type="number" id="dependentes" name="dependentes">

            <label for="telefone">Telefone*:</label>
            <input type="tel" id="telefone" name="telefone" required>

            <label for="email">E-mail*:</label>
            <input type="email" id="email" name="email" required>
        </fieldset>

        <h2>Localização</h2>
        <fieldset>
            <label for="estado">Estado*:</label>
            <input type="text" id="estado" name="estado" required>

            <label for="cidade">Cidade*:</label>
            <input type="text" id="cidade" name="cidade" required>
        </fieldset>

        <h2>Mensagem do Usuário</h2>
        <fieldset>
            <label for="urgencia">Grau de Urgência:</label>
            <input type="text" id="urgencia" name="urgencia">

            <label for="mensagem">Mensagem*:</label>
            <textarea id="mensagem" name="mensagem" rows="4" cols="40" required></textarea>

            <label for="arquivo">Reportar Erro:</label>
            <input type="file" id="arquivo" name="arquivo">
        </fieldset>

        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>

        <p><small>*Preenchimento obrigatório</small></p>
    </form>

</body>
</html>
